services:
  database:
    image: postgis/postgis:15-3.3
    container_name: udyam_db
    environment:
      POSTGRES_DB: udyam_db
      POSTGRES_USER: udyam_user
      POSTGRES_PASSWORD: udyam_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - udyam_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U udyam_user -d udyam_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: udyam_backend
    environment:
      - DATABASE_URL=postgresql://udyam_user:udyam_password@database:5432/udyam_db
    ports:
      - "8000:8000"
    volumes:
      - ./data/raw:/data/raw
    depends_on:
      database:
        condition: service_healthy
    networks:
      - udyam_network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/frontend.Dockerfile
    container_name: udyam_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - udyam_network

volumes:
  pgdata:

networks:
  udyam_network:
    driver: bridge
